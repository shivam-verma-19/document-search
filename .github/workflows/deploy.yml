name: Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:

# =========================
# 🧹 LINT + FORMAT
# =========================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install black==26.3.1 flake8==7.3.0 isort==8.0.1
      - name: Run Flake8
        run: flake8 . --max-line-length=88 --extend-ignore=E203,W503,F401,E501,E402

      - name: Run Black
        run: black . --check

      - name: Run isort
        run: isort . --check-only

# =========================
# 🧪 TESTS
# =========================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          export ENV=test
          pytest 
    
# =========================
# 🏗 BUILD DOCKER IMAGE
# =========================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker
        run: docker build -t rag-app .
        working-directory: backend

# =========================
# 🚀 DEPLOY (ONLY MAIN)
# =========================
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # 🔐 AWS Credentials
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 🧱 Terraform Setup
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: infra

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra

      - name: Setup Python for packaging
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'  

      - name: Create Lambda Deployment Zip
        run: |
          rm -rf lambda_package
          rm -f backend/deployment.zip
              
          mkdir -p lambda_package/backend
              
          # Build dependencies inside AWS Lambda container
          docker run --rm \
            --entrypoint /bin/bash \
            -v $(pwd):/var/task \
            public.ecr.aws/lambda/python:3.13 \
            -c "
              pip install -r backend/requirements-lambda.txt \
              --platform manylinux2014_x86_64 \
              --only-binary=:all: \
              -t lambda_package/
              
              find lambda_package -type d -name tests -exec rm -rf {} +
              find lambda_package -type d -name __pycache__ -exec rm -rf {} +
            "
              
          # Copy backend code
          cp backend/__init__.py lambda_package/backend/__init__.py
          cp -r backend/app lambda_package/backend/
              
          # Create deployment zip
          cd lambda_package
              
          zip -r ../backend/deployment.zip . \
            -x "*__pycache__*" \
            -x "*.pyc" \
            -x "*.dist-info/*" \
            -x "*.egg-info/*"
              
          cd ..
              
          ls -lh backend/deployment.zip
              
          SIZE=$(du -m backend/deployment.zip | cut -f1)
              
          if [ "$SIZE" -gt 70 ]; then
            echo "ERROR: Lambda zip exceeds 70MB limit"
            exit 1
          fi
        
      - name: Terraform Plan
        run: terraform plan
        env:
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
        working-directory: infra


      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
        working-directory: infra