name: Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:

# =========================
# 🧹 LINT + FORMAT
# =========================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install black==26.3.1 flake8==7.3.0 isort==8.0.1
      - name: Run Flake8
        run: flake8 . --max-line-length=88 --extend-ignore=E203,W503,F401,E501,E402

      - name: Run Black
        run: black . --check

      - name: Run isort
        run: isort . --check-only

# =========================
# 🧪 TESTS
# =========================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          export ENV=test
          pytest

# =========================
# 🏗 BUILD DOCKER IMAGE
# =========================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker
        run: docker build -t rag-app .
        working-directory: backend

# =========================
# 🚀 DEPLOY (ONLY MAIN)
# =========================
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # 🔐 AWS Credentials
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 🧱 Terraform Setup
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: infra

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra

      - name: Setup Python for packaging
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'  

      - name: Create Lambda Deployment Zip
        run: |
          cd backend
              
          # =========================================
          # CLEAN OLD ARTIFACTS
          # =========================================
          rm -rf package
          rm -rf python
          rm -f deployment.zip
              
          mkdir -p package
          mkdir -p python
          mkdir -p package/backend
              
          # =========================================
          # INSTALL LAMBDA-COMPATIBLE DEPENDENCIES
          # =========================================
          docker run --rm \
            -v $(pwd):/var/task \
            public.ecr.aws/lambda/python:3.11 \
            pip install -r requirements-lambda.txt \
              --platform manylinux2014_x86_64 \
              --only-binary=:all: \
              -t python/
              
          # =========================================
          # COPY DEPENDENCIES TO PACKAGE
          # =========================================
          cp -r python/* package/
              
          # =========================================
          # REMOVE UNUSED LARGE PACKAGES
          # =========================================
          rm -rf ./package/torch
          rm -rf ./package/torchvision
          rm -rf ./package/torchaudio
          rm -rf ./package/sentence_transformers
          rm -rf ./package/transformers
          rm -rf ./package/tokenizers
          rm -rf ./package/huggingface_hub
          rm -rf ./package/safetensors
          rm -rf ./package/nvidia*
          rm -rf ./package/*.egg-info
              
          # =========================================
          # STRIP LARGE NATIVE BINARIES
          # =========================================
          find ./package -name "*.so" -exec strip {} \; || true
              
          # =========================================
          # REMOVE TESTS / CACHE FILES
          # =========================================
          find ./package -type d -name "tests" -exec rm -rf {} +
          find ./package -type d -name "__pycache__" -exec rm -rf {} +
              
          # =========================================
          # COPY APPLICATION CODE
          # =========================================
          cp __init__.py ./package/backend/__init__.py
          cp -r app ./package/backend
              
          # =========================================
          # CREATE ZIP
          # =========================================
          cd package
              
          zip -r ../deployment.zip . \
            -x "*__pycache__*" \
            -x "*.pyc" \
            -x "*.dist-info/*" \
            -x "*.egg-info/*"
              
          cd ..
              
          # =========================================
          # VERIFY PACKAGE
          # =========================================
          ls -lh deployment.zip
              
          SIZE=$(du -m deployment.zip | cut -f1)
              
          echo "Deployment package size: ${SIZE}MB"
              
          if [ "$SIZE" -gt 65 ]; then
            echo "ERROR: Lambda zip exceeds safe limit"
            exit 1
          fi
        
      - name: Terraform Plan
        run: terraform plan
        working-directory: infra

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: infra